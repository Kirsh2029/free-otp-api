name: Number API checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm --prefix ui ci
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
      - name: Run frontend browser regression with fixture API responses
        env:
          UI_SMOKE_NO_SANDBOX: 'true'
        run: |
          npm --prefix ui run preview > "$RUNNER_TEMP/number-api-ui-preview.log" 2>&1 &
          number_api_ui_pid=$!
          trap 'kill "$number_api_ui_pid" 2>/dev/null || true' EXIT
          for number_api_attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix ui run smoke
      - run: docker compose config --quiet
      - name: Validate optional tunnel configuration without credentials
        run: |
          install -d -m 700 "$RUNNER_TEMP/number-api-tunnel"
          printf '{}\n' > "$RUNNER_TEMP/number-api-tunnel/credentials.json"
          cp deploy/cloudflared.yml.example "$RUNNER_TEMP/number-api-tunnel/config.yml"
          NUMBER_API_TUNNEL_CREDENTIALS_FILE="$RUNNER_TEMP/number-api-tunnel/credentials.json" \
          NUMBER_API_TUNNEL_CONFIG_FILE="$RUNNER_TEMP/number-api-tunnel/config.yml" \
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      - run: curl --fail http://127.0.0.1:3030/health && curl --fail http://127.0.0.1:3030/docs/json > /dev/null
      - if: always()
        run: docker compose down
